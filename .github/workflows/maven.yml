name: Kiem Tra Code Tu Dong (CI)

# Cấu hình "Cò súng": Kịch bản này sẽ chạy khi nào?
on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  build-and-test:
    # Mượn một máy chủ chạy hệ điều hành Linux (Ubuntu) của GitHub
    runs-on: ubuntu-latest

    steps:
      - name: 1. Tải mã nguồn của nhóm về máy chủ
        uses: actions/checkout@v4

      - name: 2. Cài đặt môi trường Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'oracle' # Hoặc 'temurin'
          cache: maven

      - name: 3. Chạy lệnh Maven để Build và Đóng gói
        run: mvn clean package -DskipTests
        # Lưu ý: Tạm thời thêm -DskipTests để bỏ qua khâu viết test case phức tạp lúc đầu.
        # Sau này nhóm có code test thì xóa chữ đó đi.