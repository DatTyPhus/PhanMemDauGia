name: Java CI with Maven

# Luồng này sẽ tự động chạy mỗi khi có ai push code lên nhánh "main" hoặc tạo Pull Request
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest # Chạy trên máy chủ ảo Linux của GitHub

    steps:
      - name: Tải mã nguồn về máy ảo
        uses: actions/checkout@v3

      - name: Cài đặt Java 21 (Hoặc đổi thành phiên bản Java nhóm đang dùng)
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven # Lưu cache để những lần sau chạy nhanh hơn

      - name: Biên dịch và Chạy Unit Test tự động
        # BỎ HẲN -DskipTests ĐI! Chạy lệnh test chuẩn để hệ thống quét lỗi
        run: mvn clean test